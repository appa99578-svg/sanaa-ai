name: Build SANAA AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        shell: bash
        run: |
          PROJECT=$(find . -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found!"
            exit 1
          fi
          DIR=$(dirname "$PROJECT")
          gradle -p "$DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sanaa-ai-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
