
name: Build SANAA AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build SANAA APK
        run: |
          gradle -p sanaa-ai-phase1/sanaa-ai assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sanaa-ai-debug-apk
          path: sanaa-ai-phase1/sanaa-ai/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
